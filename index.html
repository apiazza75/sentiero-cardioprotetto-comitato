<style>
:root{--ink:#0b0f12;--paper:#f3f0e9;--ecg:#e11d2a;--stone:#78838c}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--ink);color:var(--paper);
  font-family:Archivo,system-ui,sans-serif;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(120% 90% at 78% 12%,rgba(200,112,60,.18),transparent 58%),
             radial-gradient(90% 80% at 8% 96%,rgba(225,29,42,.20),transparent 60%);
}
.ecg{position:fixed;left:0;width:100%;top:50%;height:260px;transform:translateY(-50%);opacity:.3;pointer-events:none}
.ecg use{fill:none;stroke:var(--ecg);stroke-linecap:round;stroke-linejoin:round}
.base{stroke-width:2;opacity:.3}
.sweep{stroke-width:2.4;filter:drop-shadow(0 0 12px rgba(225,29,42,.9))}
.cur{fill:#fff;filter:drop-shadow(0 0 12px rgba(255,95,105,.95));animation:bt 5s linear infinite}
@keyframes bt{0%,100%{r:4}6%{r:8}15%{r:4}}
.box{position:relative;width:min(430px,100%);text-align:left}
.eyebrow{
  font-size:.7rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ecg);
  display:flex;align-items:center;gap:.7em;margin:0 0 1.3em;
}
.eyebrow::before{content:'';width:34px;height:2px;background:var(--ecg)}
h1{
  font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;
  font-size:clamp(2rem,7vw,2.9rem);line-height:1;letter-spacing:-.01em;margin:0 0 .5em;
}
h1 em{font-style:normal;color:var(--ecg)}
p.sub{color:#a9b3bb;font-size:.94rem;line-height:1.55;margin:0 0 2em;max-width:38ch}
label{display:block;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--stone);margin-bottom:8px}
.riga{display:flex;gap:10px}
input{
  flex:1;min-width:0;font:inherit;font-size:1rem;padding:14px 15px;border-radius:3px;
  border:1px solid rgba(243,240,233,.22);background:rgba(243,240,233,.05);color:var(--paper);
  transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:#5c666e}
input:focus{outline:0;border-color:var(--ecg);box-shadow:0 0 0 3px rgba(225,29,42,.18)}
button{
  font:inherit;font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;
  padding:14px 24px;border:0;border-radius:3px;background:var(--ecg);color:#fff;cursor:pointer;
  transition:background .25s,transform .2s;white-space:nowrap;
}
button:hover:not(:disabled){background:#a8121b;transform:translateY(-2px)}
button:disabled{opacity:.55;cursor:default}
.msg{min-height:1.4em;margin:14px 0 0;font-size:.85rem;color:var(--ecg)}
.msg.ok{color:#8b959e}
.nota{margin:2.4em 0 0;font-size:.76rem;color:#5c666e;line-height:1.5}
@media (max-width:430px){.riga{flex-direction:column}}
</style>
</head>

(function(){
  'use strict';
  var msg=document.getElementById('msg'), btn=document.getElementById('btn'), campo=document.getElementById('pw');

  /* spazzata luminosa sul tracciato, come nell'hero del sito */
  try{
    var linea=document.getElementById('l'), sw=document.getElementById('sw'), L=linea.getTotalLength();
    sw.style.strokeDasharray=(L*0.12)+' '+L;
    sw.animate([{strokeDashoffset:0},{strokeDashoffset:-L}],{duration:5000,iterations:Infinity,easing:'linear'});
  }catch(e){}

  function b2a(b64){
    var s=atob(b64), u=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
    return u;
  }

  async function apri(pw, silenzioso){
    var d=window.DATI;
    var mat=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b2a(d.s), iterations:d.n, hash:'SHA-256'},
      mat, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var chiaro=await crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(d.i)}, key, b2a(d.c));
    var html=new TextDecoder().decode(chiaro);
    try{ sessionStorage.setItem('scp', pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }

  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    btn.disabled=true; msg.className='msg ok'; msg.textContent='Decifro la pagina…';
    try{
      await apri(campo.value, false);
    }catch(err){
      msg.className='msg'; msg.textContent='Password non corretta.';
      btn.disabled=false; campo.select();
    }
  });

  /* già entrato in questa sessione: non richiede di nuovo la password */
  try{
    var salvata=sessionStorage.getItem('scp');
    if(salvata) apri(salvata, true).catch(function(){ sessionStorage.removeItem('scp'); });
  }catch(e){}
})();
</script>
